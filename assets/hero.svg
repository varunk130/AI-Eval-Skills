<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="AI Eval Skills. 6 skills covering plan, generate, run, interpret, and triage for evaluating AI agents.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#10162c"/>
      <stop offset="100%" style="stop-color:#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c83fd"/>
      <stop offset="100%" style="stop-color:#0078d4"/>
    </linearGradient>
    <linearGradient id="define" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1a73e8"/>
    </linearGradient>
    <linearGradient id="iterate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#7c5cff"/>
    </linearGradient>
    <linearGradient id="expand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffb259"/>
      <stop offset="100%" style="stop-color:#ea8600"/>
    </linearGradient>
    <linearGradient id="ops" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#0d652d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)" rx="12"/>

  <ellipse cx="200" cy="190" rx="260" ry="160" fill="#7c5cff" opacity="0.10"/>
  <ellipse cx="1000" cy="190" rx="240" ry="140" fill="#10b981" opacity="0.08"/>

  <g opacity="0.05" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="76" x2="1200" y2="76"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="304" x2="1200" y2="304"/>
  </g>

  <rect x="80" y="42" width="80" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Glyph: lab flask / eval -->
  <g transform="translate(80, 62)">
    <rect width="56" height="56" rx="12" fill="#0078d4" opacity="0.18"/>
    <path d="M22 12 L22 22 L14 40 Q14 46 20 46 L36 46 Q42 46 42 40 L34 22 L34 12 Z" fill="none" stroke="#7c83fd" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="22" y1="12" x2="34" y2="12" stroke="#7c83fd" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="24" cy="36" r="2" fill="#34d399"/>
    <circle cx="32" cy="38" r="1.5" fill="#34d399"/>
  </g>

  <text x="156" y="100" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">AI Eval Skills</text>

  <text x="156" y="135" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#c8d2e8">Plan → generate → run → interpret → triage. The full eval loop for any AI agent.</text>

  <rect x="80" y="170" width="1040" height="1" fill="#ffffff" opacity="0.12"/>

  <!-- 4-stage map -->
  <g transform="translate(80, 200)" font-family="-apple-system, sans-serif" text-anchor="middle">
    <g transform="translate(120, 0)">
      <rect x="-110" y="0" width="220" height="84" rx="10" fill="url(#define)" opacity="0.95"/>
      <text y="24" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="2">DEFINE</text>
      <text y="48" font-size="15" font-weight="700" fill="#ffffff">Plan what to test</text>
      <text y="68" font-size="11" font-weight="500" fill="#cfe2ff">/eval-suite-planner</text>
    </g>
    <text x="240" y="48" font-size="22" fill="#7c83fd">›</text>
    <g transform="translate(370, 0)">
      <rect x="-110" y="0" width="220" height="84" rx="10" fill="url(#iterate)" opacity="0.95"/>
      <text y="24" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="2">BASELINE &amp; ITERATE</text>
      <text y="48" font-size="15" font-weight="700" fill="#ffffff">Generate · Run · Read</text>
      <text y="68" font-size="11" font-weight="500" fill="#efe6ff">generator · interpreter · triage</text>
    </g>
    <text x="490" y="48" font-size="22" fill="#7c83fd">›</text>
    <g transform="translate(620, 0)">
      <rect x="-110" y="0" width="220" height="84" rx="10" fill="url(#expand)"/>
      <text y="24" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="2">EXPAND</text>
      <text y="48" font-size="15" font-weight="700" fill="#ffffff">Broaden coverage</text>
      <text y="68" font-size="11" font-weight="500" fill="#fff3e0">re-run planner with scope</text>
    </g>
    <text x="740" y="48" font-size="22" fill="#7c83fd">›</text>
    <g transform="translate(870, 0)">
      <rect x="-110" y="0" width="220" height="84" rx="10" fill="url(#ops)"/>
      <text y="24" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="2">OPERATIONALIZE</text>
      <text y="48" font-size="15" font-weight="700" fill="#ffffff">CI/CD &amp; monitor</text>
      <text y="68" font-size="11" font-weight="500" fill="#e6f4ea">regression detection</text>
    </g>
  </g>

  <!-- Bottom skill chips -->
  <g transform="translate(80, 312)" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">
    <g><rect width="160" height="22" rx="11" fill="#1c2342" stroke="#3b82f6" stroke-width="1"/><text x="80" y="15" text-anchor="middle" fill="#cfe2ff">/eval-suite-planner</text></g>
    <g transform="translate(170, 0)"><rect width="135" height="22" rx="11" fill="#1c2342" stroke="#a78bfa" stroke-width="1"/><text x="68" y="15" text-anchor="middle" fill="#efe6ff">/eval-generator</text></g>
    <g transform="translate(315, 0)"><rect width="200" height="22" rx="11" fill="#1c2342" stroke="#a78bfa" stroke-width="1"/><text x="100" y="15" text-anchor="middle" fill="#efe6ff">/eval-result-interpreter</text></g>
    <g transform="translate(525, 0)"><rect width="220" height="22" rx="11" fill="#1c2342" stroke="#a78bfa" stroke-width="1"/><text x="110" y="15" text-anchor="middle" fill="#efe6ff">/eval-triage-and-improvement</text></g>
    <g transform="translate(755, 0)"><rect width="170" height="22" rx="11" fill="#1c2342" stroke="#ffb259" stroke-width="1"/><text x="85" y="15" text-anchor="middle" fill="#fff3e0">/cost-quality-frontier</text></g>
    <g transform="translate(935, 0)"><rect width="105" height="22" rx="11" fill="#1c2342" stroke="#34d399" stroke-width="1"/><text x="52" y="15" text-anchor="middle" fill="#e6f4ea">/find-skills</text></g>
  </g>
</svg>
